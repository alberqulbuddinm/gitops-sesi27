apiVersion: v1
kind: ConfigMap
metadata:
  name: simple-nginx-html
data:
  index.html: |
    Ini tampilan dari NGINX dan nama saya Alber Qulbuddin Mohammad
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-nginx
  labels:
    app: simple-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-nginx
  template:
    metadata:
      labels:
        app: simple-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: html
          configMap:
            name: simple-nginx-html
---
apiVersion: v1
kind: Service
metadata:
  name: simple-nginx
spec:
  type: NodePort
  selector:
    app: simple-nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
