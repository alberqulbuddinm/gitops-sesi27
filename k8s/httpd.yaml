apiVersion: v1
kind: ConfigMap
metadata:
  name: simple-httpd-html
data:
  index.html: |
    Ini tampilan dari HTTPD dan nama saya Alber Qulbuddin Mohammad
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-httpd
  labels:
    app: simple-httpd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simple-httpd
  template:
    metadata:
      labels:
        app: simple-httpd
    spec:
      containers:
        - name: httpd
          image: httpd:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/local/apache2/htdocs/index.html
              subPath: index.html
      volumes:
        - name: html
          configMap:
            name: simple-httpd-html
---
apiVersion: v1
kind: Service
metadata:
  name: simple-httpd
spec:
  type: NodePort
  selector:
    app: simple-httpd
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
